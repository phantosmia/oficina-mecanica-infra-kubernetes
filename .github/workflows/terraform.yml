name: Terraform Infra Kubernetes

on:
  pull_request:
  push:
    branches:
      - homologacao
      - producao
  workflow_dispatch:
    inputs:
      auth_mode:
        description: "Modo de autenticação AWS"
        type: choice
        options:
          - oidc
          - aws-academy
        default: aws-academy

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-k8s-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_AUTH_MODE: ${{ inputs.auth_mode || vars.AWS_AUTH_MODE || 'aws-academy' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'us-east-1' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}

jobs:
  plan:
    name: Plan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (sem backend remoto — plan de validação, não usa state real)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var="environment=dev-preview"

  apply:
    name: Apply (${{ github.ref_name }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar credenciais AWS via OIDC
        if: ${{ env.AWS_AUTH_MODE == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar credenciais AWS Academy
        if: ${{ env.AWS_AUTH_MODE == 'aws-academy' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Preparar backend remoto do Terraform
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          if [ -n "${TF_BACKEND_CONFIG}" ]; then
            printf '%s\n' "${TF_BACKEND_CONFIG}" | sed "s#/dev/#/${{ github.ref_name }}/#" > backend.hcl
          else
            if [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_LOCK_TABLE}" ]; then
              echo "Configure o secret TF_BACKEND_CONFIG ou as variables TF_STATE_BUCKET e TF_LOCK_TABLE." >&2
              exit 1
            fi

            cat > backend.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "kubernetes/${{ github.ref_name }}/terraform.tfstate"
          region         = "${TF_STATE_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF
          fi

      - name: Preparar variáveis do Terraform
        env:
          AUTH_MODE: ${{ env.AWS_AUTH_MODE }}
          EKS_ADMIN_PRINCIPAL_ARN: ${{ vars.EKS_ADMIN_PRINCIPAL_ARN }}
          EKS_CLUSTER_ROLE_ARN: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
          EKS_NODE_ROLE_ARN: ${{ vars.EKS_NODE_ROLE_ARN }}
          NODE_DESIRED_SIZE: ${{ vars.NODE_DESIRED_SIZE || '1' }}
          NODE_MIN_SIZE: ${{ vars.NODE_MIN_SIZE || '1' }}
          NODE_MAX_SIZE: ${{ vars.NODE_MAX_SIZE || '2' }}
          NODE_DISK_SIZE: ${{ vars.NODE_DISK_SIZE || '20' }}
          TF_STATE_BUCKET: ${{ env.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ env.TF_STATE_REGION }}
        run: |
          python - <<'PY'
          import json
          import os

          values = {}
          # O ARN do secret do RDS e lido automaticamente via terraform_remote_state
          # do repositorio oficina-mecanica-infra-banco-dados (ver database_state_key
          # em variables.tf); aqui so repassamos bucket/regiao do backend compartilhado
          # quando configurados, para nao depender dos defaults do Terraform.
          if os.environ.get("TF_STATE_BUCKET"):
              values["tf_state_bucket"] = os.environ["TF_STATE_BUCKET"]
          if os.environ.get("TF_STATE_REGION"):
              values["tf_state_region"] = os.environ["TF_STATE_REGION"]

          if os.environ["AUTH_MODE"] == "aws-academy":
              required = [
                  "EKS_ADMIN_PRINCIPAL_ARN",
                  "EKS_CLUSTER_ROLE_ARN",
                  "EKS_NODE_ROLE_ARN",
              ]
              missing = [name for name in required if not os.environ.get(name)]
              if missing:
                  raise SystemExit(f"Configure as GitHub variables obrigatórias para aws-academy: {', '.join(missing)}")

              values.update(
                  {
                      "eks_admin_principal_arn": os.environ["EKS_ADMIN_PRINCIPAL_ARN"],
                      "eks_cluster_role_arn": os.environ["EKS_CLUSTER_ROLE_ARN"],
                      "eks_node_role_arn": os.environ["EKS_NODE_ROLE_ARN"],
                      "enable_irsa_resources": False,
                      "enable_github_actions_oidc": False,
                      "install_aws_load_balancer_controller": False,
                      "install_external_secrets_operator": False,
                      "node_desired_size": int(os.environ["NODE_DESIRED_SIZE"]),
                      "node_min_size": int(os.environ["NODE_MIN_SIZE"]),
                      "node_max_size": int(os.environ["NODE_MAX_SIZE"]),
                      "node_disk_size": int(os.environ["NODE_DISK_SIZE"]),
                  }
              )

          with open("terraform.auto.tfvars.json", "w", encoding="utf-8") as file:
              json.dump(values, file)
          PY

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Ajustar módulo EKS para AWS Academy
        if: ${{ env.AWS_AUTH_MODE == 'aws-academy' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          module_file = Path(".terraform/modules/eks/main.tf")
          content = module_file.read_text(encoding="utf-8")
          block_start = content.index('data "aws_iam_session_context" "current" {')
          block_end = content.index("\n}", block_start)
          block = content[block_start:block_end]

          old = "count = local.create ? 1 : 0"
          new = "count = local.create && var.enable_cluster_creator_admin_permissions ? 1 : 0"

          if new in block:
              print("Módulo EKS já compatível com AWS Academy.")
          elif old in block:
              patched_block = block.replace(old, new, 1)
              content = content[:block_start] + patched_block + content[block_end:]
              module_file.write_text(content, encoding="utf-8")
              print("Módulo EKS ajustado para evitar iam:GetRole em voclabs.")
          else:
              raise SystemExit("Não foi possível localizar o count esperado em data.aws_iam_session_context.current.")
          PY

      - name: Ajustar módulo EKS para permitir escalar desired_size via Terraform
        run: |
          python - <<'PY'
          from pathlib import Path

          module_file = Path(".terraform/modules/eks/modules/eks-managed-node-group/main.tf")
          content = module_file.read_text(encoding="utf-8")

          # Sem essa remoção, o node group ignora silenciosamente qualquer mudança em
          # node_desired_size após a criação inicial (não há cluster autoscaler neste projeto
          # para disputar esse campo com o Terraform).
          old = "    ignore_changes = [\n      scaling_config[0].desired_size,\n    ]\n"
          new = ""

          if old not in content:
              if "ignore_changes" not in content:
                  print("Módulo EKS já sem o ignore_changes de desired_size.")
              else:
                  raise SystemExit("Não foi possível localizar o ignore_changes esperado no node group do módulo EKS.")
          else:
              module_file.write_text(content.replace(old, new, 1), encoding="utf-8")
              print("ignore_changes de scaling_config[0].desired_size removido do módulo EKS.")
          PY

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan \
            -var="environment=${{ github.ref_name }}" \
            -var="database_state_key=database/${{ github.ref_name }}/terraform.tfstate"

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Resumo dos outputs
        run: |
          echo "cluster_name, ecr_repository_url e oidc_provider_arn são lidos automaticamente"
          echo "pelo repositório oficina-mecanica-fiap via terraform_remote_state — nada a copiar."
          echo ""
          echo "cluster_name        = $(terraform output -raw cluster_name)"
          echo "ecr_repository_url  = $(terraform output -raw ecr_repository_url)"
          echo "oidc_provider_arn   = $(terraform output -raw oidc_provider_arn)"
          echo ""
          echo "Só estes dois ainda exigem cópia manual (não são dado de estado, são credenciais/config):"
          echo "AWS_ROLE_TO_ASSUME (secret no oficina-mecanica-fiap, workflow publish-ecr.yml) = $(terraform output -raw github_actions_ecr_role_arn)"
          echo "allowed_cidr_blocks (tfvars/variable no oficina-mecanica-infra-banco-dados), a partir de vpc_cidr_block = $(terraform output -raw vpc_cidr_block)"
